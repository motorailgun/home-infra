---
- name: Install node exporter packages
  ansible.builtin.apt:
    name:
      - prometheus-node-exporter
      - prometheus-node-exporter-collectors
      - smartmontools
      - nvme-cli
    state: present

- name: Enable node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter.service
    enabled: true
    state: started

- name: Enable textfile collector timers
  ansible.builtin.systemd_service:
    name: "prometheus-node-exporter-{{ item }}.timer"
    enabled: true
    state: started
  loop:
    - apt
    - nvme
    - smartmon
